<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/pretendard.css">
<style>
  /* AX 영상 스타일 가이드 v4.1 — Deep Navy / Warm Ivory / Muted Slate · Gold 메인 · Secondary teal 1계열 */
  :root { --gold:#d2a45f; --gold2:#b97935; --gold-soft:#e8c995; --sec:#3f8585; --sec-soft:#7fb7b2;

              -webkit-font-smoothing:antialiased; word-break:keep-all; }

  .light { --ink:#171b20; --ink2:rgba(23,27,32,.72); --ink3:rgba(23,27,32,.5); --hi:#a96a27; --acc:#b97935; --line:rgba(23,27,32,.06); color:var(--ink); }

  .chip::before { content:''; width:14px; height:14px; border-radius:50%; background:var(--c, var(--gold)); flex:none; }

  .browser { border-radius:18px; overflow:hidden; border:1px solid rgba(255,255,255,.14); background:#f5f7fa; box-shadow:0 50px 90px -30px rgba(0,0,0,.85); }
  .light .browser { border-color:rgba(23,27,32,.12); box-shadow:0 40px 80px -36px rgba(70,45,20,.45); }

  /* 자막 — 밝은 장면에서도 같은 어두운 상자 */
  #sub { position:absolute; display:flex; align-items:flex-end; justify-content:center; z-index:50; }

  body.h #sub { left:160px; right:160px; top:842px; height:150px; }
  #sub span { padding:16px 30px; border-radius:20px; background:rgba(15,18,22,.82); border:1px solid rgba(255,255,255,.10);
              font-weight:700; letter-spacing:-.01em; line-height:1.38; text-align:center; white-space:pre-line; color:#f4f1ec; }
  body.v #sub span { max-width:816px; font-size:52px; } body.h #sub span { max-width:1500px; font-size:46px; }
  #sub b { color:var(--gold-soft); font-weight:800; }
  #brand { position:absolute; z-index:40; font-size:22px; font-weight:700; letter-spacing:.14em; color:rgba(244,241,236,.55); }
  body.v #brand { display:none; } body.h #brand { left:120px; top:40px; }
  #brand.onlight { color:rgba(23,27,32,.5); }
  /* AX 활용 예시 상단 고정 제목 · 단계 표시 (V3) */
  .axbar { position:absolute; z-index:45; background:rgba(14,18,24,.92); border:1px solid rgba(232,201,149,.45); border-radius:22px; box-shadow:0 24px 50px -24px rgba(0,0,0,.7); color:#f4f1ec; }

  .axbar .ttl { font-weight:800; letter-spacing:-.02em; }
  .axbar .sub { color:rgba(244,241,236,.74); font-weight:600; }
  .axbar .sub i { display:inline-block; width:10px; height:10px; border-radius:50%; background:#e07a5f; margin-right:10px; vertical-align:middle; }
  .trk { position:absolute; z-index:45; display:flex; align-items:center; gap:0; }
  .trk .pill { position:relative; border-radius:999px; white-space:nowrap; font-weight:800; letter-spacing:-.01em; }
  .trk .pill > span { display:block; border-radius:999px; }
  .trk .pill .l0 { background:rgba(14,18,24,.62); color:rgba(244,241,236,.62); border:1px solid rgba(255,255,255,.14); }
  .trk .pill .l1 { position:absolute; inset:0; background:linear-gradient(180deg,#e8c995,#c9974f); color:#16110d; border:1px solid #e8c995; box-shadow:0 0 0 6px rgba(210,164,95,.22); }
  .trk .pill .l2 { position:absolute; inset:0; background:rgba(14,18,24,.9); color:#e8c995; border:1px solid rgba(232,201,149,.55); }
  .trk .ar { color:#c9974f; font-weight:900; text-shadow:0 1px 6px rgba(0,0,0,.35); }
  /* KODIT: 사진 가장자리 부드럽게 (배경이 남은 잘라낸 사진을 같은 배경 위에) */
  .fe { -webkit-mask-image:linear-gradient(to right, transparent, #000 9%, #000 91%, transparent), linear-gradient(to bottom, transparent, #000 9%, #000 91%, transparent);
        -webkit-mask-composite:source-in; mask-composite:intersect; }
  .feR { -webkit-mask-image:radial-gradient(closest-side, #000 62%, transparent 100%); }
  .vcard { border-radius:28px; padding:34px 40px; }
  .val { font-weight:800; letter-spacing:-.03em; line-height:1.05; color:var(--hi); font-variant-numeric:tabular-nums; }
  .lbl { font-size:34px; font-weight:700; color:var(--ink2); }
  .pin { width:34px; height:34px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 10px rgba(210,164,95,.28), 0 0 0 22px rgba(210,164,95,.12); }
  /* ── V2 효과 (도구 가이드 V1 참고: 흐름선 배경 · 롱테이크 · 계산 그래프 · 분해도) ── */
  canvas.flow { position:absolute; left:50%; top:50%; transform-origin:50% 50%; }
  .world { position:absolute; left:0; top:0; transform-origin:0 0; }
  .ui { position:absolute; background:#fff; color:#171b20; border-radius:28px; overflow:hidden; border:1.5px solid rgba(23,27,32,.10); box-shadow:0 40px 80px -36px rgba(0,0,0,.6); }
  .ui .hd { height:64px; display:flex; align-items:center; gap:12px; padding:0 26px; border-bottom:1px solid rgba(23,27,32,.08); font-weight:800; letter-spacing:.06em; font-size:22px; }
  .ui .hd small { font-weight:600; letter-spacing:0; color:rgba(23,27,32,.5); font-size:18px; }
  .phone .screen { color:#171b20; }
  .pcard.on { border-color:#d2a45f; box-shadow:0 0 0 4px rgba(210,164,95,.35); }
  .pcard { position:absolute; border-radius:22px; background:#f6f1e9; overflow:hidden; border:1.5px solid rgba(23,27,32,.08); }
  .pcard img { width:100%; height:62%; object-fit:cover; object-position:center 40%; display:block; }
  .pcard .nm { padding:12px 16px 0; font-size:22px; font-weight:800; } .pcard .pr { padding:2px 16px; font-size:18px; color:rgba(23,27,32,.55); font-weight:700; }
  .btn { position:absolute; display:flex; align-items:center; justify-content:center; gap:10px; border-radius:16px; font-weight:800; font-size:24px; border:1.5px solid rgba(23,27,32,.14); background:#fff; color:#171b20; transform-origin:50% 50%; }
  .btn.dark { background:#171b20; color:#fff; border-color:#171b20; }
  .btn .hrt { font-size:28px; color:#c2513f; } .btn.on .hrt::before { content:'♥'; } .btn:not(.on) .hrt::before { content:'♡'; }
  .cursor { position:absolute; width:40px; height:40px; z-index:30; pointer-events:none; }
  .cursor svg { display:block; filter:drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
  .ripple { position:absolute; width:90px; height:90px; margin:-45px 0 0 -45px; border-radius:50%; border:3px solid rgba(210,164,95,.9); opacity:0; z-index:29; }
  .morph { position:absolute; border-radius:22px; background:#171b20; color:#f4f1ec; border:1.5px solid rgba(232,201,149,.55); overflow:hidden; box-shadow:0 30px 60px -30px rgba(0,0,0,.6); }
  .panel { position:absolute; border-radius:28px; background:#1b2129; border:1.5px solid rgba(255,255,255,.14); box-shadow:0 40px 80px -36px rgba(0,0,0,.7); color:#f4f1ec; }
  .panel .pt { font-size:24px; font-weight:800; letter-spacing:.14em; color:#e8c995; }
  .chk { display:inline-flex; width:46px; height:46px; border-radius:50%; border:3px solid rgba(232,201,149,.6); align-items:center; justify-content:center; font-size:26px; font-weight:900; color:transparent; }
  .chk.on { background:linear-gradient(180deg,#e8c995,#c9974f); border-color:#e8c995; color:#16110d; }
  .plate { position:absolute; transform-origin:0 0; border-radius:18px; border:1.5px solid rgba(232,201,149,.55); }
  .lane { position:absolute; height:6px; border-radius:3px; background:rgba(23,27,32,.12); }
  .ldot { position:absolute; width:22px; height:22px; margin:-8px 0 0 -11px; border-radius:50%; }
  .stair { position:absolute; border-radius:22px; border:1.5px solid rgba(23,27,32,.12); background:#fff; box-shadow:0 30px 60px -36px rgba(70,45,20,.35); }
  .ring { position:absolute; border-radius:50%; border:1.5px dashed rgba(232,201,149,.45); }
  .guide { position:absolute; pointer-events:none; outline:2px dashed rgba(255,80,80,.7); display:none; z-index:99; }
  body.show-guide .guide { display:block; }
</style></head>
<body class="/*FMT*/"><div id="stage">
<!--SCENES-->
  <div id="brand">주식회사 가연인터내셔널 · MIRYEO AX</div>
  <div id="sub"><span></span></div>
<!--GUIDES-->
</div>
<script>
  const SUBS = /*SUBS*/;
  const DUR = /*DUR*/;
  const LIGHT = /*LIGHT*/;
  const HIDEBRAND = /*HIDEBRAND*/;
  if (new URLSearchParams(location.search).get('guide')) document.body.classList.add('show-guide');
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const eo = (x) => 1 - Math.pow(1 - x, 3);
  const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const lerp = (a, b, x) => a + (b - a) * x;
  const vis = (t, tin, tout, d = .6) => Math.min(eo(clamp((t - tin) / d)), 1 - eio(clamp((t - (tout - d * .8)) / (d * .8))));
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const animated = [...document.querySelectorAll('[data-in]')];
  const draws = [...document.querySelectorAll('[data-draw]')].map((p) => ({ p, L: p.getTotalLength(), r: p.dataset.draw.split(',').map(Number) }));
  const grows = [...document.querySelectorAll('[data-grow]')];
  const growsH = [...document.querySelectorAll('[data-growh]')];
  const strikes = [...document.querySelectorAll('[data-strike]')];
  const orbits = [...document.querySelectorAll('[data-orbit]')];
  const kbs = [...document.querySelectorAll('[data-kb]')];
  const moves = [...document.querySelectorAll('[data-move]')];
  const counts = [...document.querySelectorAll('[data-count]')];
  const focuses = [...document.querySelectorAll('[data-focus]')];
  const widths = [...document.querySelectorAll('[data-w]')];
  const bgs = [...document.querySelectorAll('.bgD,.bgL,.bgS')];
  const subEl = document.querySelector('#sub span'); const brand = document.getElementById('brand');
  let subIdx = -2;

  // ── V2 효과 ─────────────────────────────────────────────
  const qio = (x) => (x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2);   // quintInOut — 빠른 카메라 이동은 가운데에 모은다
  // 흐름선 배경 (시드 고정, 한 번만 그림) — 왼쪽 청록 → 오른쪽 금, 가운데는 어둡고 차분하게, 밝은 점 없이
  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  for (const cv of document.querySelectorAll('canvas.flow')) {
    const seed = +cv.dataset.seed, W_ = +cv.width, H_ = +cv.height, rnd = mulberry(seed), g = cv.getContext('2d');
    g.fillStyle = '#10161d'; g.fillRect(0, 0, W_, H_);
    const ph = [rnd() * 6.28, rnd() * 6.28, rnd() * 6.28, rnd() * 6.28];
    const ang = (x, y) => { const u = x / W_, v = y / H_; return Math.sin(u * 3.1 + ph[0]) * 1.4 + Math.cos(v * 4.3 + ph[1]) * 1.1 + Math.sin((u + v) * 5.7 + ph[2]) * .6 + Math.cos((u - v) * 2.3 + ph[3]) * .5; };
    g.lineWidth = 1.6; g.lineCap = 'round';
    const N = +(cv.dataset.n || 2600);
    for (let i = 0; i < N; i++) {
      let x = rnd() * W_, y = rnd() * H_;
      const cxn = (x / W_ - .5) / .32, cyn = (y / H_ - .46) / .26; const edge = Math.min(1, Math.sqrt(cxn * cxn + cyn * cyn) / 1.6);
      if (rnd() > .12 + edge * .88) continue;                     // 가운데는 드물게
      const u = x / W_; const mix = Math.min(1, Math.max(0, (u - .2) / .6));
      const r = Math.round(63 + (210 - 63) * mix), gg = Math.round(133 + (164 - 133) * mix), b = Math.round(133 + (95 - 133) * mix);
      const a = (.05 + .16 * edge) * (.6 + rnd() * .4);
      g.strokeStyle = `rgba(${r},${gg},${b},${a.toFixed(3)})`; g.beginPath(); g.moveTo(x, y);
      const L = 40 + rnd() * 90;
      for (let k = 0; k < L; k++) { const th = ang(x, y); x += Math.cos(th) * 2.2; y += Math.sin(th) * 2.2; g.lineTo(x, y); }
      g.stroke();
    }
    const vg = g.createRadialGradient(W_ / 2, H_ * .46, Math.min(W_, H_) * .12, W_ / 2, H_ * .46, Math.max(W_, H_) * .62);
    vg.addColorStop(0, 'rgba(12,16,22,.78)'); vg.addColorStop(1, 'rgba(12,16,22,0)'); g.fillStyle = vg; g.fillRect(0, 0, W_, H_);
  }
  const flows = [...document.querySelectorAll('canvas.flow[data-push]')];
  const cams = [...document.querySelectorAll('[data-cam]')];
  const cursors = [...document.querySelectorAll('[data-cursor]')];
  const ripples = [...document.querySelectorAll('[data-ripple]')];
  const presses = [...document.querySelectorAll('[data-press]')];
  const ons = [...document.querySelectorAll('[data-on]')];
  const morphs = [...document.querySelectorAll('[data-morph]')];
  const mvs = [...document.querySelectorAll('[data-mv]')];
  const lanes = [...document.querySelectorAll('[data-lane]')];
  const segs = (s) => s.split(';').map((q) => q.split(',').map(Number));
  const countks = [...document.querySelectorAll('[data-countk]')];   // 만원 단위 → "4억 7천만 원"
  const fmtk = (v) => { v = Math.round(v / 1000) * 1000; const e = Math.floor(v / 10000), r = Math.round((v % 10000) / 1000); return (e ? `${e}억` : '') + (r ? ` ${r}천만` : (e ? '' : '0')) + ' 원'; };
  function renderV2(t) {
    for (const c of countks) { const [a, b, f, to] = c.dataset.countk.split(',').map(Number); c.textContent = fmtk(lerp(f, to, eo(clamp((t - a) / (b - a))))); }
    for (const c of flows) { const [a, b, s0, s1] = c.dataset.push.split(',').map(Number); const k = clamp((t - a) / (b - a)); c.style.transform = `translate(-50%,-50%) scale(${lerp(s0, s1, k) * +(c.dataset.fit || 1)})`; }
    //  data-cam="t0,t1,x0,y0,s0,x1,y1,s1;…" — 세계 좌표 (x,y)를 화면 가운데에, 배율 s. 정지점에서는 정수 px
    for (const w of cams) {
      const sg = segs(w.dataset.cam); const [VW, VH] = (w.dataset.view || '1920,1080').split(',').map(Number);
      let st = sg[0].slice(2, 5), moving = false;
      for (const [a, b, x0, y0, s0, x1, y1, s1] of sg) { if (t <= a) break; const k = qio(clamp((t - a) / (b - a))); moving = k > 0 && k < 1; st = [lerp(x0, x1, k), lerp(y0, y1, k), lerp(s0, s1, k)]; }
      let tx = VW / 2 - st[0] * st[2], ty = VH / 2 - st[1] * st[2];
      if (!moving) { tx = Math.round(tx); ty = Math.round(ty); }
      w.style.transform = `translate(${tx}px,${ty}px) scale(${st[2]})`;
    }
    //  data-cursor="t0,t1,x0,y0,x1,y1;…" — 호(arc)로 이동
    for (const c of cursors) {
      const sg = segs(c.dataset.cursor); let p = sg[0].slice(2, 4);
      for (const [a, b, x0, y0, x1, y1] of sg) {
        if (t <= a) break; const k = eio(clamp((t - a) / (b - a)));
        const mx = (x0 + x1) / 2 - (y1 - y0) * .11, my = (y0 + y1) / 2 + (x1 - x0) * .11;
        p = [(1 - k) ** 2 * x0 + 2 * (1 - k) * k * mx + k * k * x1, (1 - k) ** 2 * y0 + 2 * (1 - k) * k * my + k * k * y1];
      }
      c.style.left = `${Math.round(p[0])}px`; c.style.top = `${Math.round(p[1])}px`;
    }
    for (const r of ripples) { const k = clamp((t - +r.dataset.ripple) / .45); r.style.opacity = k > 0 && k < 1 ? (1 - k) * .9 : 0; r.style.transform = `scale(${lerp(.3, 1.5, eo(k))})`; }
    for (const b of presses) { const t0 = +b.dataset.press; const k = t < t0 ? 0 : t < t0 + .12 ? (t - t0) / .12 : Math.max(0, 1 - (t - t0 - .12) / .18); b.style.scale = `${1 - .03 * k}`; }
    for (const e of ons) e.classList.toggle('on', t >= +e.dataset.on);
    //  data-morph="t0,dur,x0,y0,w0,h0,x1,y1,w1,h1" — 버튼이 카드로 늘어남
    for (const m of morphs) { const [a, d, x0, y0, w0, h0, x1, y1, w1, h1] = m.dataset.morph.split(',').map(Number); const k = eo(clamp((t - a) / d));
      m.style.left = `${Math.round(lerp(x0, x1, k))}px`; m.style.top = `${Math.round(lerp(y0, y1, k))}px`; m.style.width = `${Math.round(lerp(w0, w1, k))}px`; m.style.height = `${Math.round(lerp(h0, h1, k))}px`; }
    //  data-mv="t0,t1,x0,y0,x1,y1;…" — 여러 구간 이동
    for (const e of mvs) { const sg = segs(e.dataset.mv); let p = sg[0].slice(2, 4);
      for (const [a, b, x0, y0, x1, y1] of sg) { if (t <= a) break; const k = (e.dataset.ease === 'q' ? qio : eio)(clamp((t - a) / (b - a))); p = [lerp(x0, x1, k), lerp(y0, y1, k)]; }
      e.style.translate = `${Math.round(p[0])}px ${Math.round(p[1])}px`; }
    //  data-lane="t0,speed,x0,x1" — 판매속도 점이 줄을 따라 반복 이동
    for (const e of lanes) { const [a, sp, x0, x1] = e.dataset.lane.split(',').map(Number); const L = x1 - x0; const d = Math.max(0, t - a) * sp; e.style.left = `${x0 + (d % L)}px`; }
  }
  function render(t) {
    renderV2(t);
    // 배경 흔들림(drift) 없음 — 단독 영상은 끈다 (도구 가이드 §2-1)
    for (const el of animated) {
      const tin = +el.dataset.in, tout = +el.dataset.out, a = el.dataset.a || 'fade';
      const isScene = el.classList.contains('scene');
      const p = eo(clamp((t - tin) / .8));
      let op = isScene ? vis(t, tin, tout, .55) : vis(t, tin, tout, .7);
      if (el.dataset.dim) op *= lerp(1, .38, eo(clamp((t - +el.dataset.dim) / .5)));
      el.style.opacity = op;
      el.style.visibility = op <= 0.001 ? 'hidden' : 'visible';
      const base = el.dataset.t || '';
      if (a === 'up') el.style.transform = `${base} translateY(${(1 - p) * 34}px)`;
      else if (a === 'left') el.style.transform = `${base} translateX(${(1 - p) * -60}px)`;
      else if (a === 'scale') el.style.transform = `${base} scale(${lerp(.94, 1, p)})`;
      else if (a === 'card') el.style.transform = `${base} translateY(${(1 - p) * 60}px) scale(${lerp(.92, 1, p)})`;
      else if (a === 'push') el.style.transform = `${base} translateY(${(1 - p) * 160}px) scale(${lerp(.82, 1, p)})`;
    }
    for (const { p, L, r } of draws) { p.style.strokeDasharray = L; p.style.strokeDashoffset = L * (1 - eio(clamp((t - r[0]) / (r[1] - r[0])))); }
    for (const g of grows) { const [a, b, w] = g.dataset.grow.split(',').map(Number); g.style.width = `${lerp(0, w, eio(clamp((t - a) / (b - a))))}px`; }
    for (const g of growsH) { const [a, b, h] = g.dataset.growh.split(',').map(Number); g.style.height = `${lerp(0, h, eio(clamp((t - a) / (b - a))))}px`; }
    for (const s of strikes) s.style.width = `calc(${eio(clamp((t - +s.dataset.strike) / .8)) * 100}% + 12px)`;
    for (const o of orbits) {
      const [t0, cx, cy, rx, ry, per] = o.dataset.orbit.split(',').map(Number);
      const ang = -Math.PI / 2 + Math.max(0, t - t0) / per * Math.PI * 2;
      o.style.left = `${cx + rx * Math.cos(ang) - 11}px`; o.style.top = `${cy + ry * Math.sin(ang) - 11}px`;
    }
    //  data-kb="t0,t1,s0,x0,y0,s1,x1,y1;t2,t3,…" — 여러 구간 이어 붙이기 (스크롤·확대 이동)
    for (const im of kbs) {
      const segs = im.dataset.kb.split(';').map((s) => s.split(',').map(Number));
      let st = segs[0].slice(2, 5); // 시작 상태
      for (const sg of segs) {
        const [a, b, s0, x0, y0, s1, x1, y1] = sg;
        if (t <= a) break;
        const k = eio(clamp((t - a) / (b - a)));
        st = [lerp(s0, s1, k), lerp(x0, x1, k), lerp(y0, y1, k)];
      }
      im.style.transform = `translate(${st[1]}px, ${st[2]}px) scale(${st[0]})`;
    }
    //  data-move="t0,t1,x0,y0,s0,x1,y1,s1" — 요소 위치 이동 (흩어짐 → 수렴)
    for (const m of moves) {
      const [a, b, x0, y0, s0, x1, y1, s1] = m.dataset.move.split(',').map(Number);
      const k = eio(clamp((t - a) / (b - a)));
      m.style.translate = `${lerp(x0, x1, k)}px ${lerp(y0, y1, k)}px`; m.style.scale = `${lerp(s0, s1, k)}`;
    }
    //  data-count="t0,t1,from,to,decimals,suffix"
    for (const c of counts) {
      const [a, b, f, to, dec] = c.dataset.count.split(',').map(Number); const suf = c.dataset.count.split(',')[5] || '';
      const v = lerp(f, to, eo(clamp((t - a) / (b - a))));
      c.textContent = (dec ? v.toFixed(dec) : Math.round(v).toLocaleString('ko-KR')) + suf;
    }
    //  data-w="t0,t1,w0,w1;t2,t3,w1,w2" — 폭 변화 (줄어듦·늘어남)
    for (const e of widths) {
      const segs = e.dataset.w.split(';').map((q) => q.split(',').map(Number)); let w = segs[0][2];
      for (const [a, b, w0, w1] of segs) { if (t <= a) break; w = lerp(w0, w1, eio(clamp((t - a) / (b - a)))); }
      e.style.width = `${w}px`;
    }
    for (const f of focuses) { const [a, b] = f.dataset.focus.split(',').map(Number); f.style.opacity = Math.min(eo(clamp((t - a) / .4)), 1 - eo(clamp((t - b) / .4))); }
    const onLight = LIGHT.some(([a, b]) => t >= a + .3 && t < b - .2);
    brand.className = onLight ? 'onlight' : '';
    brand.style.opacity = HIDEBRAND.some(([a, b]) => t >= a - .3 && t < b + .3) ? 0 : 1;
    const i = SUBS.findIndex(([a, b]) => t >= a - .12 && t < b + .12);
    if (i !== subIdx) { subIdx = i; if (i >= 0) subEl.innerHTML = esc(SUBS[i][2]).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
    if (i < 0) subEl.parentElement.style.opacity = 0;
    else { const [a, b] = SUBS[i]; subEl.parentElement.style.opacity = Math.min(clamp((t - a + .12) / .12), clamp((b + .12 - t) / .12)); }
  }
  window.render = render; window.DUR = DUR;
  render(+(new URLSearchParams(location.search).get('t') || 0));
</script>
</body></html>
